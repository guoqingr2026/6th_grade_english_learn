name: Deploy to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release folder
        run: |
          mkdir -p release
          cp index.html app.js styles.css study-hub.js gratitude.js mastery.js release/
          cp VERSION CHANGELOG.md FINAL_PRODUCT_MANUAL.md DEPLOY.md release/ 2>/dev/null || true
          cp -r assets data scripts release/
          if [ -d docs ]; then cp -r docs release/; fi
          touch release/.nojekyll
          if [ ! -f release/使用说明.txt ]; then echo "See FINAL_PRODUCT_MANUAL.md" > release/使用说明.txt; fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./release
          force_orphan: true
