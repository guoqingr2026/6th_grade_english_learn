name: 新人教PEP六年上英语学习训练营V1.0 · Pages 部署

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p release
          cp index.html app.js styles.css study-hub.js gratitude.js mastery.js release/
          cp VERSION CHANGELOG.md FINAL_PRODUCT_MANUAL.md DEPLOY.md release/ 2>/dev/null || true
          cp -r assets data scripts release/
          if [ -d docs ]; then cp -r docs release/; fi
          touch release/.nojekyll
          if [ ! -f release/使用说明.txt ]; then echo "See FINAL_PRODUCT_MANUAL.md" > release/使用说明.txt; fi
          echo "=== deploy bundle ==="
          wc -c release/app.js release/styles.css release/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./release
          force_orphan: true
          commit_message: "deploy: 新人教PEP六年上英语学习训练营V1.0"
