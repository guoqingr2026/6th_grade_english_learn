name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css study-hub.js gratitude.js mastery.js _site/
          cp VERSION CHANGELOG.md FINAL_PRODUCT_MANUAL.md DEPLOY.md _site/ 2>/dev/null || true
          cp -r assets data scripts _site/
          if [ -d docs ]; then cp -r docs _site/; fi
          touch _site/.nojekyll
          echo "Built files:"
          ls -la _site/
          wc -c _site/app.js _site/styles.css _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
